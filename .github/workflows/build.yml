name: build-apk
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recreate project files
        run: |
          mkdir -p 'app'
          echo  | base64 -d > 'app/build.gradle'
          mkdir -p 'app/src/main'
          echo  | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p 'app/src/main/java/com/yuna/chwiket'
          echo  | base64 -d > 'app/src/main/java/com/yuna/chwiket/MainActivity.kt'
          echo cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNS4yJyBhcHBseSBmYWxzZQogICAgaWQgJ29yZy5qZXRicmFpbnMua290bGluLmFuZHJvaWQnIHZlcnNpb24gJzEuOS4yNCcgYXBwbHkgZmFsc2UKfQo= | base64 -d > 'build.gradle'
          echo YW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCm9yZy5ncmFkbGUuanZtYXJncz0tWG14MjA0OG0Ka290bGluLmNvZGUuc3R5bGU9b2ZmaWNpYWwK | base64 -d > 'gradle.properties'
          echo cGx1Z2luTWFuYWdlbWVudCB7CiAgICByZXBvc2l0b3JpZXMgeyBnb29nbGUoKTsgbWF2ZW5DZW50cmFsKCk7IGdyYWRsZVBsdWdpblBvcnRhbCgpIH0KfQpkZXBlbmRlbmN5UmVzb2x1dGlvbk1hbmFnZW1lbnQgewogICAgcmVwb3NpdG9yaWVzIHsgZ29vZ2xlKCk7IG1hdmVuQ2VudHJhbCgpIH0KfQpyb290UHJvamVjdC5uYW1lID0gImNod2lrZXQiCmluY2x1ZGUgIjphcHAiCg== | base64 -d > 'settings.gradle'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
